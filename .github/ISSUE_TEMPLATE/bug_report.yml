name: Bug Report
description: File a bug report for flutter_chromium_webview
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide as much detail as possible.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform did this occur on?
      options:
        - macOS
        - Windows
        - Linux
        - Android
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Initialize ChromiumWebViewController with ...
        2. Load URL ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Flutter Doctor & Environment
      description: Output of `flutter doctor -v` and OS version details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Crash Reports
      description: Paste any crash stack traces or CEF logs (`cef.log`).
