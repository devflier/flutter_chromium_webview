name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'platform_interface-v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Focused diagnostics; all retains every required release check
        type: choice
        options: [all, android-html, android, macos-performance, macos-isolation]
        default: all
      live_youtube:
        description: 'Run independent external YouTube validation (never a publication dependency)'
        type: boolean
        default: false
      public_dependencies:
        description: 'Verify plugin against already published interface 0.1.7'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation_scope || 'all' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  interface_checks:
    name: Platform interface API and publication readiness
    if: ${{ !startsWith(inputs.validation_scope, 'android') && !startsWith(inputs.validation_scope, 'macos-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Release-report and dependency-origin regressions
        run: |
          python3 -m unittest discover -s scripts -p test_release_validation.py -v
          python3 -m unittest discover -s scripts -p test_public_dependency.py -v
      - name: Interface API, tests, example and dry run
        run: |
          set -euo pipefail
          mkdir -p docs/validation/interface
          exec > >(tee docs/validation/interface/checks.log) 2>&1
          cd packages/flutter_chromium_webview_platform_interface
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib example/test
          flutter analyze
          flutter test
          dart pub publish --dry-run
          cd example
          flutter pub get
          flutter analyze
          flutter test
          flutter build web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interface-readiness
          path: docs/validation/interface/

  quality:
    name: Dart/Flutter Quality
    if: ${{ !startsWith(inputs.validation_scope, 'android') && !startsWith(inputs.validation_scope, 'macos-') }}
    needs: interface_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Setup Workspace Overrides
        run: python3 scripts/ensure_monorepo_overrides.py

      - name: Resolve Workspace Dependencies
        run: |
          for dir in $(find . -name pubspec.yaml -exec dirname {} \;); do
            echo "Resolving in $dir"
            (cd "$dir" && flutter pub get)
          done

      - name: Check Formatting
        run: |
          dart format .
          if ! git diff --exit-code; then
            git diff > formatting_diff.patch
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: formatting-diff
          path: formatting_diff.patch

      - name: Main Package Checks
        working-directory: packages/flutter_chromium_webview
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart pub publish --dry-run


  linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/platform_interface-v') && !startsWith(inputs.validation_scope, 'android') && !startsWith(inputs.validation_scope, 'macos-') }}
    name: Linux
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb pulseaudio pulseaudio-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Linux Native, Integration and Release checks
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=validation
          pactl set-default-sink validation
          xvfb-run -a ./scripts/validate_linux.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-native-logs
          path: docs/validation/linux-native.log

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/platform_interface-v') && !startsWith(inputs.validation_scope, 'android') && !startsWith(inputs.validation_scope, 'macos-') }}
    name: Windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Windows native, integration and release checks
        shell: pwsh
        run: ./scripts/validate_windows.ps1

      - name: Copied release bundle startup and normal shutdown
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'chromium-webview-bundle'
          ./scripts/package_windows.ps1 -NoBuild -Destination $bundle
          ./scripts/smoke_windows.ps1 -Bundle $bundle -LogDirectory ./docs/validation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-logs
          path: docs/validation/windows-packaged-*.log

  android:
    if: ${{ always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && startsWith(inputs.validation_scope, 'android')) || (needs.quality.result == 'success' && !startsWith(github.ref, 'refs/tags/platform_interface-v') && !startsWith(inputs.validation_scope, 'macos-'))) }}
    name: Android
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator checks and release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/investigate_android.sh "${{ inputs.validation_scope }}"

      - uses: actions/upload-artifact@v7
        if: ${{ success() && inputs.validation_scope != 'android-html' }}
        with:
          name: android-example-apk
          path: packages/flutter_chromium_webview/example/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-diagnostics
          path: docs/validation/

  macos:
    name: macOS deterministic native lifecycle and rendering
    needs: quality
    if: ${{ !startsWith(github.ref, 'refs/tags/platform_interface-v') && !startsWith(inputs.validation_scope, 'android') && !startsWith(inputs.validation_scope, 'macos-') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Required native tools
        run: |
          command -v cmake
          command -v pod
          xcodebuild -version

      - name: Native build, integrations, texture ownership and bundle shutdown
        run: bash scripts/validate_macos.sh core

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-validation-diagnostics
          path: |
            docs/validation/macos-core/
            docs/validation/macos-packaged-*.log

  macos_memory:
    name: ${{ inputs.validation_scope == 'macos-isolation' && 'macOS pipeline isolation (diagnostic only)' || 'macOS decoded-media RSS and ownership acceptance' }}
    needs: quality
    if: ${{ always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && startsWith(inputs.validation_scope, 'macos-')) || (needs.quality.result == 'success' && !startsWith(github.ref, 'refs/tags/platform_interface-v') && !startsWith(inputs.validation_scope, 'android'))) }}
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.validation_scope == 'macos-isolation' && 100 || 45 }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Required native tools
        run: |
          command -v cmake
          command -v pod
          xcodebuild -version

      - name: Local decoded media, RSS acceptance and completeness checks
        env:
          PERFORMANCE_DIAGNOSTICS: ${{ startsWith(inputs.validation_scope, 'macos-') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.validation_scope }}" = macos-isolation ]; then
            bash scripts/macos_pipeline_experiment.sh
            exit 0
          fi
          bash scripts/validate_macos.sh memory
          if [ "$PERFORMANCE_DIAGNOSTICS" = true ]; then
            python3 scripts/macos_performance_report.py --report docs/validation/macos-memory/allocation-profile.json --directory docs/validation/macos-memory/performance-summary
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-memory-diagnostics
          path: |
            docs/validation/macos-memory/
            docs/validation/macos-pipeline-experiment/
            docs/validation/macos-packaged-*.log

  macos_youtube_live:
    name: macOS live YouTube (external service)
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_youtube }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Required native tools
        run: |
          command -v cmake
          command -v pod
          xcodebuild -version

      - name: Live service and external-challenge classification
        run: bash scripts/validate_macos.sh live

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-live-diagnostics
          path: |
            docs/validation/macos-live/
            docs/validation/macos-packaged-*.log

  public_dependency_readiness:
    name: Plugin public dependency and archive readiness
    needs: interface_checks
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.public_dependencies) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve actual published dependency (fails if 0.1.7 unavailable)
        run: bash scripts/verify_public_dependencies.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-dependency-readiness
          path: docs/validation/public-dependencies/

  publish_webview:
    name: Publish main package
    needs: [quality, linux, windows, android, macos, macos_memory, public_dependency_readiness]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Check release tag matches package version
        run: bash scripts/check_release_tag.sh packages/flutter_chromium_webview v

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Resolve verified public dependency for upload
        working-directory: packages/flutter_chromium_webview
        run: |
          rm -f pubspec_overrides.yaml
          flutter pub get
          python3 ../../scripts/verify_hosted_interface.py .dart_tool/package_config.json
          dart pub publish --dry-run

      - name: Publish flutter_chromium_webview
        working-directory: packages/flutter_chromium_webview
        run: dart pub publish --force

  publish_interface:
    name: Publish platform interface
    needs: [interface_checks, quality]
    if: startsWith(github.ref, 'refs/tags/platform_interface-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Check release tag matches package version
        run: bash scripts/check_release_tag.sh packages/flutter_chromium_webview_platform_interface platform_interface-v

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      - name: Install dependencies
        working-directory: packages/flutter_chromium_webview_platform_interface
        run: flutter pub get

      - name: Publish platform_interface
        working-directory: packages/flutter_chromium_webview_platform_interface
        run: dart pub publish --force
