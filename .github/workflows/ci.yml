name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'platform_interface-v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Dart/Flutter Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      
      - name: Resolve Workspace Dependencies
        run: |
          for dir in $(find . -name pubspec.yaml -exec dirname {} \;); do
            echo "Resolving in $dir"
            (cd "$dir" && flutter pub get)
          done
          
      - name: Check Formatting
        run: |
          dart format .
          if ! git diff --exit-code; then
            git diff > formatting_diff.patch
            exit 1
          fi
          
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: formatting-diff
          path: formatting_diff.patch
        
      - name: Platform Interface Checks
        working-directory: packages/flutter_chromium_webview_platform_interface
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart pub publish --dry-run
          
      - name: Main Package Checks
        working-directory: packages/flutter_chromium_webview
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart pub publish --dry-run

      - name: Platform Interface Example Checks
        working-directory: packages/flutter_chromium_webview_platform_interface/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web

  linux:
    name: Linux
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb pulseaudio pulseaudio-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          
      - name: Linux Native, Integration and Release checks
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=validation
          pactl set-default-sink validation
          xvfb-run -a ./scripts/validate_linux.sh
          
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-native-logs
          path: docs/validation/linux-native.log

  windows:
    name: Windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          
      - name: Windows native, integration and release checks
        shell: pwsh
        run: ./scripts/validate_windows.ps1
        
      - name: Copied release bundle startup and normal shutdown
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'chromium-webview-bundle'
          ./scripts/package_windows.ps1 -NoBuild -Destination $bundle
          ./scripts/smoke_windows.ps1 -Bundle $bundle -LogDirectory ./docs/validation
          
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-logs
          path: docs/validation/windows-packaged-*.log

  android:
    name: Android
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          
      - name: Emulator checks and release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: pwsh -File scripts/validate_android.ps1 -Device emulator-5554
          
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: android-example-apk
          path: packages/flutter_chromium_webview/example/build/app/outputs/flutter-apk/app-release.apk
          
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-diagnostics
          path: docs/validation/

  macos:
    name: macOS
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          
      - name: Required native tools
        run: |
          command -v cmake
          command -v pod
          xcodebuild -version
          
      - name: Native build, integrations, texture ownership and bundle shutdown
        run: bash scripts/validate_macos.sh
        
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-validation-diagnostics
          path: |
            docs/validation/macos/
            docs/validation/macos-packaged-*.log

  publish_webview:
    name: Publish main package
    needs: [quality, linux, windows, android, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          
      - name: Check release tag matches package version
        run: bash scripts/check_release_tag.sh packages/flutter_chromium_webview v
        
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'
          
      - name: Install dependencies
        working-directory: packages/flutter_chromium_webview
        run: flutter pub get
        
      - name: Publish flutter_chromium_webview
        working-directory: packages/flutter_chromium_webview
        run: dart pub publish --force

  publish_interface:
    name: Publish platform interface
    needs: [quality, linux, windows, android, macos]
    if: startsWith(github.ref, 'refs/tags/platform_interface-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          
      - name: Check release tag matches package version
        run: bash scripts/check_release_tag.sh packages/flutter_chromium_webview_platform_interface platform_interface-v
        
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'
          
      - name: Install dependencies
        working-directory: packages/flutter_chromium_webview_platform_interface
        run: flutter pub get
        
      - name: Publish platform_interface
        working-directory: packages/flutter_chromium_webview_platform_interface
        run: dart pub publish --force
