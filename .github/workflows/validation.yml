name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Package and example checks
        working-directory: packages/flutter_chromium_webview
        run: |
          python3 -m unittest discover -s macos/test -p 'test_*.py' -v
          flutter pub get
          flutter analyze
          flutter test
          cd example
          flutter pub get
          flutter analyze
          flutter test test
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Windows native, integration and release checks
        shell: pwsh
        run: ./scripts/validate_windows.ps1
      - name: Copied release bundle startup and normal shutdown
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'chromium-webview-bundle'
          ./scripts/package_windows.ps1 -NoBuild -Destination $bundle
          ./scripts/smoke_windows.ps1 -Bundle $bundle -LogDirectory ./docs/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs
          path: docs/validation/windows-packaged-*.log
