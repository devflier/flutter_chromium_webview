name: macOS experimental validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Required native tools
        run: |
          command -v cmake
          command -v pod
          xcodebuild -version
      - name: Native build, integrations, texture ownership and bundle shutdown
        run: bash scripts/validate_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-logs
          path: docs/validation/macos-packaged-*.log
